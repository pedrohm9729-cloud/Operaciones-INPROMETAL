<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | INPROMETAL</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para centrar el login */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
            background-color: var(--bg-app);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.03) 0px, transparent 50%);
        }
        
        .login-card {
            width: 400px;
            max-width: 100%;
            padding: 40px;
            border-radius: 20px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .login-logo {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            margin-bottom: 8px;
        }
        
        .login-logo i {
            width: 24px;
            height: 24px;
        }
        
        .login-title {
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .login-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition);
        }
        
        .login-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
        }
        
        .login-input:focus + i {
            color: var(--color-primary);
        }
        
        .btn-login {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            font-size: 14px;
        }
        
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--color-danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .error-message i {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card card">
            <div class="login-header">
                <img src="inprometal_logo.png?v=2" alt="INPROMETAL Logo" style="max-height: 80px; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.25));">
                <div>
                    <h2 class="login-title">Control de Acceso</h2>
                    <p class="login-subtitle">Introduce tus credenciales de INPROMETAL</p>
                </div>
            </div>
            
            <div class="error-message" id="error-panel">
                <i data-lucide="alert-circle"></i>
                <span id="error-text">Usuario o contraseña incorrectos.</span>
            </div>
            
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input login-input" placeholder="Ingresa tu usuario" required autocomplete="username">
                        <i data-lucide="user"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input login-input" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                        <i data-lucide="lock"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login" id="btn-submit-login">
                    <span>Ingresar al Sistema</span>
                </button>
            </form>
        </div>
    </div>
    
    <script src="login.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
