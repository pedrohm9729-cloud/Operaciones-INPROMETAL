name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Build & Deploy PHP Backend + Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Generar coda_config.php desde Secrets de GitHub
        env:
          CODA_API_KEY: ${{ secrets.CODA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public/api
          printf '<?php\ndefine("CODA_API_KEY", "%s");\ndefine("CODA_DOC_ID", "vjnLYcbb8p");\ndefine("GEMINI_API_KEY", "%s");\ndefine("DASHBOARD_USERNAME", "admin");\ndefine("DASHBOARD_PASSWORD_HASH", "24349fe89774a95630febc217fee673bd9f77d1fb6bb5b6caa37a270fe867ba5");\n' \
            "$CODA_API_KEY" "$GEMINI_API_KEY" > public/api/coda_config.php
          echo "✅ coda_config.php generado exitosamente"

      - name: 🔍 Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: 🚀 Subir archivos vía SCP a Hostinger
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          REMOTE_HOST="88.223.84.94"
          REMOTE_PORT="65002"
          REMOTE_USER="u746393752"
          REMOTE_PATH="/home/u746393752/domains/inprometal.com/public_html/ops"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          
          echo "📤 Subiendo archivos a: $REMOTE_PATH"
          
          # Crear directorio si no existe
          sshpass -p "$SFTP_PASSWORD" ssh -p $REMOTE_PORT $SSH_OPTS \
            $REMOTE_USER@$REMOTE_HOST \
            "mkdir -p $REMOTE_PATH" 2>&1 || true
          
          # Subir todos los archivos de public/ recursivamente
          sshpass -p "$SFTP_PASSWORD" scp \
            -P $REMOTE_PORT \
            $SSH_OPTS \
            -r ./public/* \
            $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
          
          # Eliminar default.html de Hostinger para permitir que index.html sea la por defecto
          echo "🧹 Eliminando default.html de Hostinger si existe..."
          sshpass -p "$SFTP_PASSWORD" ssh -p $REMOTE_PORT $SSH_OPTS \
            $REMOTE_USER@$REMOTE_HOST \
            "rm -f $REMOTE_PATH/default.html" 2>&1 || true
          
          echo "✅ Despliegue completado"
