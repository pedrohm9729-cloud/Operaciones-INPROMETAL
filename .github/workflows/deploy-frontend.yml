name: Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Build & Deploy PHP Backend + Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Generar coda_config.php desde Secrets de GitHub
        env:
          CODA_API_KEY: ${{ secrets.CODA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public/api
          printf '<?php\ndefine("CODA_API_KEY", "%s");\ndefine("CODA_DOC_ID", "vjnLYcbb8p");\ndefine("GEMINI_API_KEY", "%s");\ndefine("DASHBOARD_USERNAME", "admin");\ndefine("DASHBOARD_PASSWORD_HASH", "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918");\n' \
            "$CODA_API_KEY" "$GEMINI_API_KEY" > public/api/coda_config.php
          echo "✅ coda_config.php generado exitosamente"

      - name: 🔍 Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: 🗺️ Descubrir ruta real del subdominio en Hostinger
        id: discover
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          # Explorar la estructura del home del usuario para encontrar ops.inprometal.com
          echo "=== Listado del home ==="
          sshpass -p "$SFTP_PASSWORD" ssh \
            -p 65002 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            u746393752@88.223.84.94 \
            'ls -la && echo "---" && find . -maxdepth 4 -name "public_html" -type d 2>/dev/null' 2>&1 || true

      - name: 🚀 Subir archivos vía SCP a Hostinger
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          # Intentar las rutas más probables de Hostinger en orden
          REMOTE_HOST="88.223.84.94"
          REMOTE_PORT="65002"
          REMOTE_USER="u746393752"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          
          echo "🔍 Buscando directorio del subdominio ops.inprometal.com..."
          REMOTE_PATH=$(sshpass -p "$SFTP_PASSWORD" ssh -p $REMOTE_PORT $SSH_OPTS \
            $REMOTE_USER@$REMOTE_HOST \
            'find . -maxdepth 5 -type d -name "public_html" 2>/dev/null | grep -i "ops" | head -1' 2>&1)
          
          echo "Ruta encontrada: $REMOTE_PATH"
          
          if [ -z "$REMOTE_PATH" ]; then
            # Fallback: buscar cualquier public_html en el home
            echo "⚠️ No se encontró ops, intentando ruta de fallback..."
            REMOTE_PATH=$(sshpass -p "$SFTP_PASSWORD" ssh -p $REMOTE_PORT $SSH_OPTS \
              $REMOTE_USER@$REMOTE_HOST \
              'ls -la 2>/dev/null' 2>&1)
            echo "Estructura home: $REMOTE_PATH"
            # Usar ruta por defecto más común en Hostinger para subdominio standalone
            REMOTE_PATH="./ops.inprometal.com/public_html"
          fi
          
          echo "📤 Subiendo archivos a: $REMOTE_PATH"
          
          # Crear directorio si no existe
          sshpass -p "$SFTP_PASSWORD" ssh -p $REMOTE_PORT $SSH_OPTS \
            $REMOTE_USER@$REMOTE_HOST \
            "mkdir -p $REMOTE_PATH" 2>&1 || true
          
          # Subir todos los archivos de public/ recursivamente
          sshpass -p "$SFTP_PASSWORD" scp \
            -P $REMOTE_PORT \
            $SSH_OPTS \
            -r ./public/* \
            $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
          
          echo "✅ Despliegue completado"
